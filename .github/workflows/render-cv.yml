name: Check CV PDF (manual)
# CV rendering runs locally through pre-commit, never in GitHub Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-cv:
    name: Check committed CV PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.71.1
          cache: true
          frozen: true
      - name: Check existing PDF without regenerating it
        run: pixi run python scripts/check_cv.py
