[workspace]
name = "onnoboru-cv"
version = "0.1.0"
description = "Reproducible tooling for synchronizing and rendering the academic CV"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"

[pypi-dependencies]
bibtexparser = "==1.4.3"
pymupdf = ">=1.24,<2"
rendercv = { version = "==2.8", extras = ["full"] }
ruamel-yaml = ">=0.19.1,<0.20"

[tasks]
sync-cv = { cmd = "python scripts/render_cv.py --sync-only", description = "Synchronize BibTeX preprints into the RenderCV YAML" }
render-cv = { cmd = "python scripts/render_cv.py", description = "Synchronize data and render the CV PDF" }
check-cv = { cmd = "python scripts/check_cv.py", depends-on = ["render-cv"], description = "Render and validate the CV PDF and its links" }
